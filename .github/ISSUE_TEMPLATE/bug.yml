name: Bug
description: Report incorrect Tabbit behavior
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome Stable, Chrome Beta, Edge, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open...\n2. Click...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Sanitized diagnostics
      description: Do not paste URLs, page titles, tokens, or private content.
