name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Review manifest permissions
        run: node scripts/check-manifest.mjs .output/chrome-mv3/manifest.json

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: tabbit-chrome-mv3
          path: .output/chrome-mv3
          if-no-files-found: error
          retention-days: 7
